name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: yarn

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Check formatting
        run: yarn lint

      - name: Build
        run: yarn build

      # static/ is committed so CTFd can serve it without a build step
      - name: Check built files are committed
        run: |
          if [ -n "$(git status --porcelain -- static)" ]; then
            git status --short -- static
            echo "static/ is out of date: run yarn build and commit the result"
            exit 1
          fi
